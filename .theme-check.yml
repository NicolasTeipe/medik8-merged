root: .

extends: :nothing

require: []

include_categories: []

exclude_categories: []

ignore:
  - node_modules/*

ConvertIncludeToRender:
  enabled: true
  ignore: []

# Safe to leave disabled
LiquidTag:
  enabled: false
  ignore: []
  min_consecutive_statements: 5

MissingTemplate:
  enabled: true
  ignore: []
  ignore_missing: []

# Safe to leave disabled
NestedSnippet:
  enabled: false
  ignore: []
  max_nesting_level: 3

RequiredLayoutThemeObject:
  enabled: true
  ignore: []

# Safe to leave disabled
SpaceInsideBraces:
  enabled: false
  ignore: []

SyntaxError:
  enabled: true
  ignore: []

# Safe to leave disabled
TemplateLength:
  enabled: false
  ignore: []
  max_length: 600
  # Exclude content of {% schema %} in line count
  exclude_schema: false
  # Exclude content of {% stylesheet %} in line count
  exclude_stylesheet: false
  # Exclude content of {% javascript %} in line count
  exclude_javascript: false

UnknownFilter:
  enabled: true
  ignore: []

UnusedAssign:
  enabled: false
  ignore: []

UnusedSnippet:
  enabled: true
  ignore: [snippets/icon-*]

MatchingSchemaTranslations:
  enabled: true
  ignore: []

# To Fix before shipping to distributors
MatchingTranslations:
  enabled: false
  ignore: []

DefaultLocale:
  enabled: true
  ignore: []

TranslationKeyExists:
  enabled: true
  ignore: []

ValidHTMLTranslation:
  enabled: true
  ignore: []

ValidJson:
  enabled: true
  ignore: []

ValidSchema:
  enabled: true
  ignore: []

MissingRequiredTemplateFiles:
  enabled: true
  ignore: []

UndefinedObject:
  enabled: true
  ignore: [
    sections/main-reset-password.liquid
  ]
  exclude_snippets: true

RequiredDirectories:
  enabled: true
  ignore: []

DeprecatedFilter:
  enabled: true
  ignore: []

DeprecateLazysizes:
  enabled: true
  ignore: []

DeprecateBgsizes:
  enabled: true
  ignore: []

MissingEnableComment:
  enabled: true
  ignore: []

ParserBlockingJavaScript:
  enabled: true
  ignore: [
    snippets/algolia.liquid
  ]

ParserBlockingScriptTag:
  enabled: true
  ignore: []

# To Fix
AssetSizeJavaScript:
  enabled: false
  threshold_in_bytes: 10_000
  ignore: []

AssetSizeCSS:
  enabled: false
  threshold_in_bytes: 100_000
  ignore: []

AssetSizeCSSStylesheetTag:
  enabled: false
  threshold_in_bytes: 100_000
  ignore: []

ImgWidthAndHeight:
  enabled: true
  ignore: []

# Safe to leave disabled since we use Uploadcare CDN
RemoteAsset:
  enabled: false
  ignore: []

AssetUrlFilters:
  enabled: true
  ignore: []

ContentForHeaderModification:
  enabled: true
  ignore: []

ImgLazyLoading:
  enabled: true
  ignore: []

HtmlParsingError:
  enabled: true
  ignore: []

AssetSizeAppBlockJavaScript:
  enabled: false
  ignore: []
  threshold_in_bytes: 10_000

AssetSizeAppBlockCSS:
  enabled: false
  ignore: []
  threshold_in_bytes: 100_000

PaginationSize:
  enabled: true
  ignore: []
  min_size: 1
  max_size: 150

DeprecatedGlobalAppBlockType:
  enabled: true

# Safe to leave disabled
SchemaJsonFormat:
  enabled: false
  start_level: 2
  indent: '  '

# Safe to leave disabled - used for appblocks 
AppBlockValidTags:
  enabled: false
  ignore: []